<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>فوازير أبو شمر – فريقين</title>

<style>
    body {
        font-family: "Tahoma", sans-serif;
        background: linear-gradient(#d0fef3, #ffffff);
        text-align: center;
        padding: 40px;
    }

    h1 {
        margin-bottom: 25px;
        color: #007fff;
        font-size: 32px;
        text-shadow: 0 0 5px #aaa;
    }

    .box {
        background: white;
        padding: 25px;
        border-radius: 15px;
        width: 450px;
        margin: auto;
        box-shadow: 0 0 15px #bbb;
    }

    button {
        padding: 12px 20px;
        margin: 10px;
        border: none;
        background: #007fff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
    }

    button:hover {
        background: #005fcc;
        transform: scale(1.05);
    }

    #riddle, #answer {
        margin-top: 20px;
        font-size: 20px;
        color: #333;
        min-height: 40px;
    }

    #answer {
        color: #008000;
        font-weight: bold;
    }

    .teams {
        display: flex;
        justify-content: space-around;
        margin-top: 25px;
    }

    .team {
        background: #ffffff;
        padding: 15px;
        border-radius: 10px;
        width: 40%;
        box-shadow: 0 0 10px #ccc;
    }

    .score {
        font-size: 28px;
        color: #007fff;
        margin-bottom: 10px;
    }
</style>
</head>

<body>

<h1>فوازير أبو شمر – فريقين</h1>

<div class="box">
    <button onclick="playSound(); showRiddle()">اعرض فزورة</button>
    <button onclick="showAnswer()">إظهار الإجابة</button>

    <p id="riddle"></p>
    <p id="answer"></p>
</div>

<div class="teams">
    <div class="team">
        <h2>فريق A</h2>
        <div class="score" id="scoreA">0</div>
        <button onclick="addPoint('A')">+ نقطة</button>
    </div>

    <div class="team">
        <h2>فريق B</h2>
        <div class="score" id="scoreB">0</div>
        <button onclick="addPoint('B')">+ نقطة</button>
    </div>
</div>

<audio id="clickSound">
