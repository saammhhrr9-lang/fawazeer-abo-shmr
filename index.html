<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>فوازير أبو شمر – لعبة فريقين</title>

<style>
    body {
        font-family: "Tahoma", sans-serif;
        background: linear-gradient(135deg, #b3e5ff, #ffffff);
        text-align: center;
        padding: 0;
        margin: 0;
    }

    h1 {
        margin-bottom: 15px;
        color: #004a9f;
        font-size: 34px;
        text-shadow: 0 0 5px #aaa;
    }

    .screen {
        min-height: 100vh;
        display: none;
        align-items: center;
        justify-content: center;
    }

    .active {
        display: flex;
    }

    .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 25px;
        border-radius: 15px;
        width: 520px;
        margin: auto;
        box-shadow: 0 0 20px #999;
    }

    button {
        padding: 10px 18px;
        margin: 8px;
        border: none;
        background: #007fff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s;
    }

    button:hover {
        background: #005fcc;
        transform: scale(1.05);
    }

    select, input {
        padding: 6px 10px;
        margin: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    #riddle, #answer, #timer {
        margin-top: 15px;
        font-size: 20px;
        color: #333;
        min-height: 32px;
    }

    #answer {
        color: #008000;
        font-weight: bold;
    }

    .teams {
        display: flex;
        justify-content: space-around;
        margin-top: 20px;
    }

    .team {
        background: #ffffff;
        padding: 15px;
        border-radius: 10px;
        width: 42%;
        box-shadow: 0 0 10px #ccc;
    }

    .score {
        font-size: 26px;
        margin-bottom: 8px;
    }

    .teamA {
        border-top: 5px solid #007bff;
    }

    .teamB {
        border-top: 5px solid #ff3b3b;
    }

    .scoreA {
        color: #007bff;
    }

    .scoreB {
        color: #ff3b3b;
    }

    #winner {
        margin-top: 20px;
        font-size: 24px;
        color: #d40000;
        font-weight: bold;
    }

    .small {
        font-size: 13px;
        color: #666;
        margin-top: 8px;
    }

    .music-btn {
        background: #00b894;
    }

    .music-btn:hover {
        background: #00916d;
    }
</style>
</head>

<body>

<!-- شاشة البداية -->
<div id="startScreen" class="screen active">
    <div class="card">
        <h1>فوازير أبو شمر</h1>
        <p>لعبة فوازير بين فريقين مع نقاط ومؤقت وجولات</p>

        <h3>إعدادات اللعبة</h3>

        <div>
            <label>عدد النقاط للفوز:</label>
            <select id="targetPoints">
                <option value="3">3 نقاط</option>
                <option value="5" selected>5 نقاط</option>
                <option value="7">7 نقاط</option>
                <option value="10">10 نقاط</option>
            </select>
        </div>

        <div>
            <label>مدة المؤقت لكل فزورة (بالثواني):</label>
            <select id="roundTime">
                <option value="10">10 ثواني</option>
                <option value="15" selected>15 ثانية</option>
                <option value="20">20 ثانية</option>
                <option value="30">30 ثانية</option>
            </select>
        </div>

        <div class="small">
            تقدر تغيّر الإعدادات في أي وقت بإعادة تحميل الصفحة
        </div>

        <button onclick="startGame()">ابدأ اللعبة</button>
        <button class="music-btn" onclick="toggleMusic()">تشغيل / إيقاف الموسيقى</button>
    </div>
</div>

<!-- شاشة اللعبة -->
<div id="gameScreen" class="screen">
    <div class="card">
        <h1>فوازير أبو شمر – فريقين</h1>

        <button onclick="startRound()">بدء الجولة</button>
        <button onclick="showAnswer()">إظهار الإجابة</button>
        <button class="music-btn" onclick="toggleMusic()">تشغيل / إيقاف الموسيقى</button>

        <p id="timer"></p>
        <p id="riddle"></p>
        <p id="answer"></p>

        <div class="teams">
            <div class="team teamA">
                <h2>فريق A</h2>
                <div class="score scoreA" id="scoreA">0</div>
                <button onclick="addPoint('A')">+ نقطة</button>
            </div>

            <div class="team teamB">
                <h2>فريق B</h2>
                <div class="score scoreB" id="scoreB">0</div>
                <button onclick="addPoint('B')">+ نقطة</button>
            </div>
        </div>

        <p id="winner"></p>

        <button onclick="resetGame()">إعادة اللعبة من جديد</button>
    </div>
</div>

<!-- شاشة الفوز -->
<div id="winScreen" class="screen">
    <div class="card">
        <h1>🎉 مبروك! 🎉</h1>
        <p id="winMessage"></p>
        <button onclick="playAgain()">لعب مرة أخرى</button>
        <button class="music-btn" onclick="toggleMusic()">تشغيل / إيقاف الموسيقى</button>
    </div>
</div>

<!-- الأصوات -->
<audio id="clickSound">
    <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3" type="audio/mpeg">
</audio>

<audio id="winSound">
    <source src="https://www.soundjay.com/human/sounds/applause-8.mp3" type="audio/mpeg">
</audio>

<audio id="bgMusic" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-littleidea.mp3" type="audio/mpeg">
</audio>

<script>

    /*  🔥🔥🔥  قائمة الألغاز المدموجة (عام + ديني)  🔥🔥🔥  */
    const riddles = [
      { q: "شي يمشي بدون رجلين… من هو؟", a: "الوقت" },
      { q: "شي إذا أكل كبر وإذا شرب صغر… ما هو؟", a: "الإسفنج" },
      { q: "شي له أسنان وما يعض… ما هو؟", a: "المشط" },
      { q: "شي تسمعه ولا تشوفه… ما هو؟", a: "الصوت" },
      { q: "شي إذا قربته منك عماك… ما هو؟", a: "النار" },
      { q: "شي كل ما أخذت منه كبر… ما هو؟", a: "الحفرة" },
      { q: "باب لا يمكن فتحه… ما هو؟", a: "الباب المفتوح" },
      { q: "شي يدخل الماء ولا يبتل… ما هو؟", a: "الظل" },
      { q: "شي يطير بلا جناح… ما هو؟", a: "الوقت" },

      { q: "شي تذبحه وتبكي عليه… ما هو؟", a: "البصل" },
      { q: "شي إذا لمسته صاح… ما هو؟", a: "الجرس" },
      { q: "شي في السماء وليس في الماء… ما هو؟", a: "حرف السين" },
      { q: "شي له أربع أرجل ولا يمشي… ما هو؟", a: "الكرسي" },
      { q: "شي لا يدخل إلا إذا ضربته… ما هو؟", a: "المسمار" },
      { q: "شي له عين ولا يرى… ما هو؟", a: "الإبرة" },
      { q: "شي يسمع بلا أذن ويتكلم بلا لسان… ما هو؟", a: "الهاتف" },
      { q: "شي إذا وضعته في الثلاجة لا يبرد… ما هو؟", a: "الفلفل الحار" },
      { q: "شي كلما مشى ترك خلفه أثرًا… ما هو؟", a: "القلم" },
      { q: "شي لا يمشي إلا بالضرب… ما هو؟", a: "الطبلة" },
      { q: "شي لا يُؤكل في الليل أبدًا… ما هو؟", a: "الفطور" },
      { q: "شي كلما زاد نقص… ما هو؟", a: "العمر" },
      { q: "شي لا يُكسر… ما هو؟", a: "المبتدأ" },
      { q: "شي له أوراق وليس نبات… ما هو؟", a: "الكتاب" },
      { q: "شي له جلد وليس حيوان… ما هو؟", a: "الكرة" },
      { q: "شي له رأس ولا عين له… ما هو؟", a: "الدبوس" },
      { q: "شي إذا أكلته تستفيد وإذا شربته تموت… ما هو؟", a: "الدواء" },
      { q: "شي إذا وقفنا أمامه لا نراه… ما هو؟", a: "الهواء" },
      { q: "شي له رقبة بدون رأس… ما هو؟", a: "الزجاجة" },
      { q: "شي له قلب ولا ينبض… ما هو؟", a: "الخس" },
      { q: "شي له جناحان ولا يطير… ما هو؟", a: "الباب" },
      { q: "شي كلما غسلتَه اتّسخ… ما هو؟", a: "الماء" },
      { q: "شي كلما مشى للأمام رجع للخلف… ما هو؟", a: "الساعة" },

      /* ألغاز دينية */
      { q: "ما هو أول ما نزل من القرآن الكريم؟", a: "اقرأ" },
      { q: "من هو أول الأنبياء؟", a: "آدم عليه السلام" },
      { q: "ما هي السورة التي تُسمى قلب القرآن؟", a: "سورة يس" },
      { q: "كم عدد أركان الإسلام؟", a: "خمسة" },
      { q: "من هو خليل الله؟", a: "إبراهيم عليه السلام" },
      { q: "ما هي أطول سورة في القرآن؟", a: "سورة البقرة" },
      { q: "ما هي أقصر سورة في القرآن؟", a: "سورة الكوثر" },
      { q: "من هو النبي الذي ابتلعه الحوت؟", a: "يونس عليه السلام" },
      { q: "ما هو الشهر الذي أنزل فيه القرآن؟", a: "رمضان" },
      { q: "كم عدد الصلوات المفروضة في اليوم؟", a: "خمس صلوات" },
      { q: "من هو النبي الذي كلمه الله مباشرة؟", a: "موسى عليه السلام" },
      { q: "ما هي القبلة الأولى للمسلمين؟", a: "بيت المقدس" },
      { q: "من هو خاتم الأنبياء؟", a: "محمد ﷺ" },
      { q: "ما هو اسم الجبل الذي رست عليه سفينة نوح؟", a: "جبل الجودي" },
      { q: "من هو أول من بنى الكعبة؟", a: "إبراهيم وإسماعيل عليهما السلام" },
      { q: "ما هي السورة التي تُسمى بسورة التوحيد؟", a: "سورة الإخلاص" },
      { q: "من هو النبي الذي كان يعمل نجارًا؟", a: "نوح عليه السلام" },
      { q: "ما هو الحيوان الذي تكلّم في القرآن؟", a: "الهدهد" },
      { q: "من هو النبي الذي صام عن الكلام؟", a: "زكريا عليه السلام" },
      { q: "ما هو اسم أم النبي محمد ﷺ؟", a: "آمنة بنت وهب" }
    ];

    let currentRiddle = null;
    let scoreA = 0;
    let scoreB = 0;
    let timerInterval;
    let targetPoints = 5;
    let roundSeconds = 15;
    let musicOn = false;

    function showScreen(id) {
        document.getElementById("startScreen").classList.remove("active");
        document.getElementById("gameScreen").classList.remove("active");
        document.getElementById("winScreen").classList.remove("active");
        document.getElementById(id).classList.add("active");
    }

    function startGame() {
        const tp = document.getElementById("targetPoints").value;
        const rt = document.getElementById("roundTime").value;
        targetPoints = parseInt(tp);
        roundSeconds = parseInt(rt);
        resetScoresOnly();
        showScreen("gameScreen");
        playSound();
    }

    function startRound() {
        playSound();
        clearInterval(timerInterval);
        document.getElementById("answer").innerText = "";
        document.getElementById("winner").innerText = "";

        const random = Math.floor(Math.random() * riddles.length);
        currentRiddle = riddles[random];
        document.getElementById("riddle").innerText = currentRiddle.q;

        let time = roundSeconds;
        document.getElementById("timer").innerText = "الوقت: " + time;

        timerInterval = setInterval(() => {
            time--;
            document.getElementById("timer").innerText = "الوقت: " + time;

            if (time <= 0) {
                clearInterval(timerInterval);
                document.getElementById("answer").innerText = "انتهى الوقت!";
            }
        }, 1000);
    }

    function showAnswer() {
        if (currentRiddle) {
            document.getElementById("answer").innerText = currentRiddle.a;
        }
    }

    function addPoint(team) {
        if (team === "A") {
            scoreA++;
            document.getElementById("scoreA").innerText = scoreA;
        } else {
            scoreB++;
            document.getElementById("scoreB").innerText = scoreB;
        }
        checkWinner();
    }

    function checkWinner() {
        if (scoreA >= targetPoints) {
            endGame("فريق A هو الفائز! 🎉");
        } else if (scoreB >= targetPoints) {
            endGame("فريق B هو الفائز! 🎉");
        }
    }

    function endGame(message) {
        clearInterval(timerInterval);
        document.getElementById("winMessage").innerText = message;
        document.getElementById("winSound").play();
        showScreen("winScreen");
    }

    function playAgain() {
        resetGame();
        showScreen("gameScreen");
    }

    function resetScoresOnly() {
        scoreA = 0;
        scoreB = 0;
        document.getElementById("scoreA").innerText = scoreA;
        document.getElementById("scoreB").innerText = scoreB;
        document.getElementById("riddle").innerText = "";
        document.getElementById("answer").innerText = "";
        document.getElementById("timer").innerText = "";
        document.getElementById("winner").innerText = "";
    }

    function resetGame() {
        clearInterval(timerInterval);
        resetScoresOnly();
        showScreen("startScreen");
    }

    function playSound() {
        document.getElementById("clickSound").play();
    }

    function toggleMusic() {
        const bg = document.getElementById("bgMusic");
        if (!musicOn) {
            bg.play();
            musicOn = true;
        } else {
            bg.pause();
            musicOn = false;
        }
    }
</script>

</body>
</html>
